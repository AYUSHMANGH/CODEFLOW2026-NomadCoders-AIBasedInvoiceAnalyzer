<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Black background -->
  <rect width="64" height="64" fill="#000000" rx="10"/>
  <!-- Vertical stroke of F -->
  <rect x="18" y="8" width="5" height="48" rx="2.5" fill="#00e5ff" filter="url(#neon)"/>
  <!-- Top horizontal stroke -->
  <rect x="18" y="8" width="30" height="5" rx="2.5" fill="#00e5ff" filter="url(#neon)"/>
  <!-- Middle horizontal stroke -->
  <rect x="18" y="28" width="24" height="5" rx="2.5" fill="#00e5ff" filter="url(#neon)"/>
  <!-- Dot on top stroke end -->
  <circle cx="48" cy="10.5" r="3" fill="#00e5ff" filter="url(#neon)"/>
  <!-- Dot on middle stroke end -->
  <circle cx="42" cy="30.5" r="3" fill="#00e5ff" filter="url(#neon)"/>
</svg>