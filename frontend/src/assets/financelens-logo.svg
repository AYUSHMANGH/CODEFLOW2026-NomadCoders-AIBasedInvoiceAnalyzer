<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer glow filter for the F letter -->
    <filter id="neon-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle inner glow for text -->
    <filter id="text-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="200" height="200" fill="#000000" rx="12"/>

  <!-- The glowing F letter (neon cyan) -->
  <!-- Vertical stroke -->
  <rect x="68" y="28" width="10" height="90" rx="5" fill="#00e5ff" filter="url(#neon-glow)"/>
  <!-- Top horizontal stroke -->
  <rect x="68" y="28" width="54" height="10" rx="5" fill="#00e5ff" filter="url(#neon-glow)"/>
  <!-- Middle horizontal stroke -->
  <rect x="68" y="68" width="44" height="10" rx="5" fill="#00e5ff" filter="url(#neon-glow)"/>

  <!-- Dot at end of top horizontal stroke -->
  <circle cx="122" cy="33" r="5" fill="#00e5ff" filter="url(#neon-glow)"/>
  <!-- Dot at end of middle horizontal stroke -->
  <circle cx="112" cy="73" r="5" fill="#00e5ff" filter="url(#neon-glow)"/>

  <!-- FINANCELENS text -->
  <text
    x="100"
    y="148"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="16"
    font-weight="bold"
    letter-spacing="3"
    text-anchor="middle"
    fill="#00e5ff"
    filter="url(#text-glow)"
  >FINANCELENS</text>

  <!-- AI ANALYTICS text -->
  <text
    x="100"
    y="168"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="8.5"
    font-weight="400"
    letter-spacing="4"
    text-anchor="middle"
    fill="#aaaaaa"
  >AI ANALYTICS</text>
</svg>
